services:
  php-fpm:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/cafesabrosos
    networks:
      - app-network
    ports:
      - "8081:8080"
    restart: unless-stopped

  nginx:
    image: nginx:latest
    volumes:
      - .:/var/www/cafesabrosos
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt  # Certificados SSL
    depends_on:
      - php-fpm
      - db2
    networks:
      - app-network
      - my_custom_network
    ports:
      - "8082:80"
      - "8443:443"
    restart: unless-stopped

  db2:
    image: mysql:8.4
    container_name: mysql_container
    environment:
      MYSQL_ROOT_PASSWORD: jose12367
      MYSQL_DATABASE: cafesabrosos
      MYSQL_USER: cafesabrosos_user
      MYSQL_PASSWORD: mSwKUr:S,_H>fun>&UE=%+9XkPH5q$
    volumes:
      - db_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d
    networks:
      - app-network
    ports:
      - "3308:3306"
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
  my_custom_network:
    external: true

volumes:
  db_data:
