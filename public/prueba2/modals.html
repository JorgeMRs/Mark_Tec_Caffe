<div id="editModal" class="modal-overlay">

            onsubmit="handleFormSubmitPedidos(event, 'editModal')">

                <label for="editId">ID Pedido:</label>
                <input type="text" id="editId" name="idPedido" readonly>
            </div>

                <input type="text" id="editClienteNombre" name="clienteNombre">
            </div>
            <div class="form-group">
                <label for="editClienteApellido">Apellido del Cliente:</label>
                <input type="text" id="editClienteApellido" name="clienteApellido">
            </div>
            <div class="form-group">
                <label for="editEmpleadoId">ID Empleado:</label>
                <input type="number" id="editEmpleadoId" name="idEmpleadoPedido">
            </div>
            <div class="form-group">
                <label for="editTotal">Total:</label>
                <input type="number" step="0.01" id="editTotal" name="totalPedido">
            </div>
            <div class="form-group">
                <label for="editEstado">Estado:</label>
                <select id="editEstado" name="estadoPedido">
                    <option value="Pendiente">Pendiente</option>
                    <option value="En Preparación">En Preparación</option>
                    <option value="Listo para Recoger">Listo para Recoger</option>
                    <option value="Completado">Completado</option>
                    <option value="Cancelado">Cancelado</option>
                </select>
            </div>
            <div class="form-group">
                <label for="editMetodoPago">Método de Pago:</label>
                <select id="editMetodoPago" name="metodoPago">
                    <option value="Efectivo">Efectivo</option>
                    <option value="Tarjeta">Tarjeta</option>
                    <option value="Transferencia">Transferencia</option>
                </select>
            </div>
            <div class="actions">
                <button type="button" class="btn btn-cancel" onclick="closeModal('editModal')">Cancelar</button>
                <button type="submit" class="btn btn-save">Guardar Cambios</button>
            </div>
        </form>
    </div>
</div>
